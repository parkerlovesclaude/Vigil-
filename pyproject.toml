[project]
name = "vigil"
version = "0.1.0"
description = "Small, auditable, single-strategy spot crypto trading system"
requires-python = ">=3.11"
dependencies = []            # standard library only
license = { text = "MIT" }

[project.optional-dependencies]
test = ["pytest>=7"]
tls = ["certifi"]          # optional CA bundle for Pythons without system certificates

[project.scripts]
vigil = "vigil.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vigil", "vigil.exchange"]

[tool.pytest.ini_options]
testpaths = ["tests"]
